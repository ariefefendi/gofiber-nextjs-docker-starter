services:

  # ==========================================================
  # BACKEND : Go Fiber API (hot reload dengan Air)
  # ==========================================================
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    ports:
      # HOST_API_PORT -> APP_PORT (container)
      - "${HOST_API_PORT:-8100}:${APP_PORT:-8000}"
    volumes:
      - ./backend:/app
      - go_mod_cache:/go/pkg/mod
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-net

  # ==========================================================
  # FRONTEND : Next.js (dev server)
  # ==========================================================
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    working_dir: /app
    command: npm run dev
    environment:
      # Rewrite /api/* di next.config.mjs diteruskan ke service backend
      BACKEND_URL: http://backend:${APP_PORT:-8000}
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Fiber + Next.js App}
      # Bind mount dari Windows/macOS sering tidak mengirim event file
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${HOST_WEB_PORT:-3100}:3000"
    volumes:
      - ./frontend:/app
      # node_modules & .next memakai volume sendiri (jangan ikut bind mount host)
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend
    networks:
      - app-net

  # ==========================================================
  # MYSQL
  # ==========================================================
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${HOST_DB_PORT:-3109}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - app-net

  # ==========================================================
  # PHPMYADMIN
  # ==========================================================
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${HOST_PMA_PORT:-9192}:80"
    depends_on:
      - mysql
    networks:
      - app-net

# Nama container, volume, dan network otomatis diawali nama folder project
# oleh Docker Compose, jadi tidak bentrok antar project.
# Yang perlu dibedakan hanya port host (.env).
volumes:
  db_data:
  go_mod_cache:
  frontend_node_modules:
  frontend_next:

networks:
  app-net:
    driver: bridge
