root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", "testdata"]
  delay = 500
  # poll = true: bind mount dari Windows/macOS sering tidak mengirim event file
  poll = true
  poll_interval = 500

[log]
  time = true

[misc]
  clean_on_exit = true
